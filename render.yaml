# Render blueprint for the Undrift API.
#
# Secrets are marked `sync: false`, which means Render prompts for them in the
# dashboard and never reads them from this file -- no credential is committed.
services:
  - type: web
    name: undrift-api
    runtime: python
    plan: free
    # Match the Neon database's region (us-east-2). Left unset, Render
    # defaults to Oregon, which puts a cross-country round trip on every
    # single query -- and one dashboard load makes several.
    region: ohio
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    # Render polls this to decide the service is up. It is the one route the
    # auth middleware leaves public, which is why the check can reach it.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"

      # --- secrets: set these in the Render dashboard ---
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false

      # The deployed dashboard's origin, so CORS lets it call this API.
      # Set this to your Vercel URL after the frontend is deployed.
      - key: ALLOWED_ORIGINS
        sync: false

      # Public GitHub usernames seeded as sample profiles, comma-separated.
      - key: SAMPLE_PROFILES
        sync: false

      # Cost ceilings on a first sync. The first two bound how much history
      # gets pulled in; the third bounds what any single refresh can spend on
      # classification, whatever else goes wrong.
      - key: MAX_REPOS
        value: "6"
      - key: MAX_COMMITS_PER_REPO
        value: "20"
      - key: MAX_COMMITS_PER_TAG_RUN
        value: "600"

      # The free plan sleeps after ~15 minutes idle, so an in-process timer
      # cannot be relied on. The GitHub Actions cron drives refreshes instead.
      - key: ENABLE_SCHEDULER
        value: "false"
